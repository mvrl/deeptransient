# TransientNet with CLIP ViT-B/32 backbone (frozen-backbone linear probe).
#
# Requires: pip install open-clip-torch
#
# The CLIP visual encoder is pre-trained on 400M image-text pairs from the
# internet. With the backbone frozen and only the linear head trained,
# Adam + cosine LR matches the paper's TransientNet-H (~3.85 %) in well
# under a minute on a single 4090.
#
# Recommended workflow:
#   1. Frozen-backbone linear probe (fast):
#        python train.py --config configs/transientnet_clip_vit_b32.yaml \
#                        --freeze-backbone \
#                        --data-root /path/to/transient_attrs \
#                        --output-dir runs/transientnet_clip_b32_frozen_adam
#
#   2. Full fine-tune from that checkpoint (optional, --init-from drops
#      the saved optimizer/scheduler so a fresh schedule kicks in):
#        python train.py --config configs/transientnet_clip_vit_b32.yaml \
#                        --init-from runs/transientnet_clip_b32_frozen_adam/checkpoint_best.pth \
#                        --lr 1e-5 --epochs 10 --optimizer adamw --amp \
#                        --data-root /path/to/transient_attrs \
#                        --output-dir runs/transientnet_clip_b32_finetune

task: transient_attrs
backbone: clip_vit_b32
pretrained: clip        # always CLIP for clip_vit_* backbones
dropout: 0.0            # the 512×40 head is small; dropout hurts here

# Data
image_dir: imageAlignedLD

# Optimisation — SGD+sigmoid+MSE stalls; Adam recovers cleanly.
optimizer: adam
scheduler: cosine
epochs: 30
batch-size: 256
lr: 0.001
weight-decay: 0.0001

# Misc
workers: 8
seed: 42
