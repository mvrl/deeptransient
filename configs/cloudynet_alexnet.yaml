# CloudyNet with AlexNet backbone (paper replication)
# Run once per fold (fold 0-4) to reproduce 5-fold results from Table 1.

task: two_class_weather
backbone: alexnet
pretrained: imagenet    # change to 'places365' for -H init
dropout: 0.5

# Data
fold: 0     # override on command line: --fold 1, --fold 2, ...

# Optimisation
epochs: 30
batch-size: 64
lr: 0.001
weight-decay: 0.0005
lr-step-size: 10
lr-gamma: 0.1

# Misc
workers: 4
seed: 42
