# TransientNet with AlexNet backbone (paper replication)
# Reproduces the TransientNet-I/-P/-H results from Table 2.

task: transient_attrs
backbone: alexnet
pretrained: imagenet    # change to 'places365' for -P or -H init
dropout: 0.5

# Data
image_dir: imageAlignedLD

# Optimisation
epochs: 50
batch-size: 64
lr: 0.001
weight-decay: 0.0005
lr-step-size: 20
lr-gamma: 0.1

# Misc
workers: 4
seed: 42
